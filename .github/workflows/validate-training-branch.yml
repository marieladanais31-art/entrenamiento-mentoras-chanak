name: Validate Chanak Training
on:
  pull_request:
    branches: [main]
  push:
    branches: [update-training-model-2026-11]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
